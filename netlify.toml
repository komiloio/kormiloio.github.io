[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/fleet/nautilus"
  to = "https://kormilo-nautilus.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/fleet/nautilus/*"
  to = "https://kormilo-nautilus.netlify.app/:splat"
  status = 200
  force = true
