[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/fleet/nautilus"
  to = "https://kormilo-nautilus.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/fleet/nautilus/*"
  to = "https://kormilo-nautilus.netlify.app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/fleet/mycelium/oauth/callback/*"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
